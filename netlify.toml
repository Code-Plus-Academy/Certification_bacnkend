[build]
  command = "pip install -r requirements.txt"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["app.py", "generator.py", "cloud_uploader.py", "templates/**", "TEMPLATE_GUIDE.md"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true

