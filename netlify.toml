[build]
  command = "cd pdf_automation && pip install -r requirements.txt"
  publish = "pdf_automation/public"
  functions = "pdf_automation/netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = ["pdf_automation/templates/**", "pdf_automation/TEMPLATE_GUIDE.md"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
