<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Automation Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0D14;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #121824;
      border: 1px solid #232D3F;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      background: linear-gradient(90deg, #1EC8F0, #2F6DF6, #8B3DF5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #232D3F;
      border-top: 4px solid #2F6DF6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(90deg, #2F6DF6, #8B3DF5);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      font-size: 14px;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>PDF Automation Studio</h1>
    <p>Serverless PDF Generation API & Template Engine</p>
    <a href="/.netlify/functions/app" class="btn">Launch Dashboard</a>
  </div>
</body>
</html>
